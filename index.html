<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Section</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="hero-section">
    <!-- Navigation -->
    <nav class="navbar">
      <div class="logo">
        <svg class="logo-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="3" fill="white"/>
          <circle cx="12" cy="5" r="2" fill="white"/>
          <circle cx="12" cy="19" r="2" fill="white"/>
          <circle cx="5" cy="12" r="2" fill="white"/>
          <circle cx="19" cy="12" r="2" fill="white"/>
          <circle cx="7.5" cy="7.5" r="1.5" fill="white"/>
          <circle cx="16.5" cy="7.5" r="1.5" fill="white"/>
          <circle cx="7.5" cy="16.5" r="1.5" fill="white"/>
          <circle cx="16.5" cy="16.5" r="1.5" fill="white"/>
        </svg>
        <span class="logo-text">React Bits</span>
      </div>
      <div class="nav-links">
        <a href="#" class="nav-link">Home</a>
        <a href="#" class="nav-link">Docs</a>
      </div>
    </nav>

    <!-- Hero Content -->
    <div class="hero-content">
      <div class="badge">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="2" y1="2" x2="6" y2="6" stroke="white" stroke-width="1.5"/>
          <line x1="4" y1="2" x2="8" y2="6" stroke="white" stroke-width="1.5"/>
          <line x1="6" y1="2" x2="10" y2="6" stroke="white" stroke-width="1.5"/>
        </svg>
        <span>New Background</span>
      </div>

      <h1 class="hero-title">
        Swirl around in the deep<br>sea of liquid chrome!
      </h1>

      <div class="cta-buttons">
        <button class="btn btn-primary">Get Started</button>
        <button class="btn btn-secondary">Learn More</button>
      </div>
    </div>
  </div>
</body>

</html>
